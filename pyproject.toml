[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benefit-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
benefit-monitor = "benefit_monitor.cli:main"
benefit-briefing = "benefit_monitor.briefing:main"

[tool.setuptools.packages.find]
include = ["benefit_monitor*"]
