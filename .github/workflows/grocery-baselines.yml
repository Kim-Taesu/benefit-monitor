name: Grocery baselines
on:
  schedule:
    # Sunday 23:07 Asia/Seoul (UTC+9), before the daily 00:37 collection.
    - cron: '7 14 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benefit-pages
  cancel-in-progress: false

jobs:
  baselines:
    # Standard runners on public repositories are free. Never consume
    # unverified private-repository allowances or change repository visibility.
    if: github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Collect weekly period-average baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m benefit_monitor.grocery_baselines --repository "$GITHUB_REPOSITORY"
