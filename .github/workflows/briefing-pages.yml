name: Daily benefit briefing
on:
  schedule:
    # 00:37 Asia/Seoul (UTC+9), off the top of the hour where GitHub load peaks.
    # The 01:00 slot was delayed 5.8-10.7h and dropped on 2026-11-04. Not guaranteed;
    # AI daily dispatches a missing collection after 10:00 KST.
    - cron: '37 15 * * *'
  workflow_dispatch:
    inputs:
      deploy_approved_snapshot:
        description: '승인된 공개 snapshot을 재검증해 배포'
        type: boolean
        default: false
      snapshot_commit:
        description: 'briefing-data의 고정 commit SHA'
        type: string
        default: ''
      expected_code_sha:
        description: '배포할 작업 브랜치의 고정 commit SHA'
        type: string
        default: ''
      apply_takedowns:
        description: '내림 목록만 현재 공개 브리핑에 적용해 재배포 (수집·snapshot 없음, 항목 제거만)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benefit-pages
  cancel-in-progress: false

jobs:
  build:
    # Standard runners on public repositories are free. Never consume
    # unverified private-repository allowances or change repository visibility.
    if: github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      collection_outcome: ${{ steps.takedown.outcome != 'skipped' && steps.takedown.outcome || steps.snapshot.outcome != 'skipped' && steps.snapshot.outcome || steps.briefing.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the requested code revision before running project code
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_approved_snapshot == true && inputs.apply_takedowns != true
        env:
          EXPECTED_CODE_SHA: ${{ inputs.expected_code_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          expected = os.environ['EXPECTED_CODE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch('[0-9a-f]{40}', expected) or actual != expected:
              raise SystemExit('Requested code revision does not match the checkout')
          PYCODE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check frontend source policy
        run: python scripts/generate_source_policy.py --check
      - name: Test
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install frontend build dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend test and build
        working-directory: frontend
        run: npm test && npm run build
      - name: Collect and export public briefing
        if: github.event_name != 'push' && inputs.deploy_approved_snapshot != true && inputs.apply_takedowns != true
        id: briefing
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m benefit_monitor.mirror --restore --repository "$BRIEFING_REPOSITORY"
          unset GH_TOKEN
          python -m benefit_monitor.publish --prepare-import
          python -m benefit_monitor.cli --online --import-items inputs/public.json
          python -m benefit_monitor.publish
      - name: Upload encrypted collection snapshot for the AI run
        # The AI run reuses today's listing collection instead of repeating it, so its HTTP budget
        # goes to official bodies. Encrypted to the public AI recipient; the plain file stays here.
        if: steps.briefing.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/install_age.py
          python -m benefit_monitor.collection_snapshot --upload
      - name: Save rechecked AI approval list (check times and withdrawals only)
        # Also after a failed collection: withdrawals already recorded must reach briefing-data.
        # The restore above recorded the sha lease; a failed or skipped restore refuses to save.
        if: steps.briefing.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_REPOSITORY: ${{ github.repository }}
        run: python -m benefit_monitor.mirror --save-ai --repository "$BRIEFING_REPOSITORY"
      - name: Apply takedowns to the current public briefing only
        # Removes taken-down AI items from the published briefing.json; no collection, no snapshot gate.
        if: github.event_name == 'workflow_dispatch' && inputs.apply_takedowns == true
        id: takedown
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_REPOSITORY: ${{ github.repository }}
        run: python -m benefit_monitor.mirror --apply-takedowns --repository "$BRIEFING_REPOSITORY"
      - name: Validate and export the approved immutable snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_approved_snapshot == true && inputs.apply_takedowns != true
        id: snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_REPOSITORY: ${{ github.repository }}
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
          EXPECTED_CODE_SHA: ${{ inputs.expected_code_sha }}
        run: >-
          python -m benefit_monitor.public_snapshot
          --repository "$BRIEFING_REPOSITORY"
          --commit "$SNAPSHOT_COMMIT"
          --expected-code-sha "$EXPECTED_CODE_SHA"
      - name: Publish failure status instead of old recommendations
        if: github.event_name != 'push' && (steps.briefing.outcome == 'failure' || steps.snapshot.outcome == 'failure')
        run: python -m benefit_monitor.publish --failure
      - name: Summarize collection status
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("delivery/public/briefing.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(f"Public briefing status: **{data['status']}**\n")
              stream.write(f"Generated: {data['generated_at']}\n")
              stream.write(f"Verified public items: {len(data['items'])}\n")
              log = Path("cache/collection_log.json")
              failures = json.loads(log.read_text()) if log.exists() else []
              for failure in failures:
                  # Only identifiers/types; never publish raw errors or URLs.
                  stream.write(f"Collection issue: {failure['source']} / {failure.get('district', '-')} / {failure.get('category', failure['reason'])}\n")
          PY
      - name: Mirror public JSON for the existing ChatGPT reader
        if: github.event_name != 'push' && inputs.deploy_approved_snapshot != true && inputs.apply_takedowns != true
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_REPOSITORY: ${{ github.repository }}
        run: python -m benefit_monitor.mirror --repository "$BRIEFING_REPOSITORY"
      - name: Assemble static frontend with unchanged public data
        if: github.event_name != 'push'
        run: python scripts/assemble_pages.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'push'
        with:
          path: delivery/site
          retention-days: 1

  deploy:
    if: github.event_name != 'push' && github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires an existing Pages configuration; do not enable a paid feature.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy public briefing
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Fail the run when collection failed, after deploying the warning
        env:
          COLLECTION_OUTCOME: ${{ needs.build.outputs.collection_outcome }}
        run: test "$COLLECTION_OUTCOME" = success

