name: Frontend P0 checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_ai_cloud:
        description: '승인된 AI 전환의 무과금 Secret·원장 검증'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: frontend-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check frontend source policy
        run: python scripts/generate_source_policy.py --check
      - name: Install verified project-local age
        run: python scripts/install_age.py
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Frontend dependencies, unit tests and build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Smoke test assembled failure-state site without collection
        run: |
          python -m benefit_monitor.publish --failure
          python scripts/assemble_pages.py
      - name: Install Chromium for local fixture tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser, accessibility and screenshot checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve screenshots and browser report (one day)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-p0-qa
          path: |
            docs/qa/screenshots
            frontend/playwright-report
          retention-days: 1
          if-no-files-found: ignore

  ai-cloud-check:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.check_ai_cloud == true &&
      github.repository == 'Kim-Taesu/benefit-monitor' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs/ai-research-playbook') &&
      github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    concurrency:
      group: benefit-ai-daily
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified project-local age
        run: python scripts/install_age.py
      - name: Check cloud state without collection or provider calls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENEFIT_AI_STATE_IDENTITY: ${{ secrets.BENEFIT_AI_STATE_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          BENEFIT_AI_CLOUD: '1'
          CHECK_ONLY: 'true'
        run: python scripts/run_ai_cloud.py
