name: Subscriptions
on:
  schedule:
    # Daily 00:12 Asia/Seoul (UTC+9), backup only; the Cloudflare cron dispatches it
    # from 03:20 KST (2026-11-20) and a scheduled run skips when today's run already succeeded.
    - cron: '12 15 * * *'
  workflow_dispatch:
    inputs:
      external_schedule:
        description: '외부 예약 실행(Cloudflare Cron, 2026-11-20 승인). 오늘 이미 성공했으면 건너뜀'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shares the pages group on purpose: both write to briefing-data.
  group: benefit-pages
  cancel-in-progress: false

jobs:
  subscriptions:
    # Standard runners on public repositories are free. Never consume
    # unverified private-repository allowances or change repository visibility.
    if: github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Skip a scheduled run when today's run already succeeded
        # Manual dispatches never run this (or any project code before the snapshot revision check).
        if: github.event_name == 'schedule' || inputs.external_schedule == true
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: 'true'
        run: python -m benefit_monitor.pipeline_timing --gate subscriptions.yml
      - name: Collect Seoul·Gyeonggi 청약 schedule (청약홈, anonymous)
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # 공공데이터포털 국토부 실거래가 API 키(2026-11-17 승인). 이 단계에만 주입하고 출력하지 않는다.
          REAL_ESTATE_TRANSACTION: ${{ secrets.REAL_ESTATE_TRANSACTION }}
        run: python -m benefit_monitor.subscriptions --repository "$GITHUB_REPOSITORY"
