name: Health notices
on:
  schedule:
    # Daily 00:07 Asia/Seoul (UTC+9), backup only; the Cloudflare cron dispatches it
    # from 03:20 KST (2026-11-20) and a scheduled run skips when today's run already succeeded.
    - cron: '7 15 * * *'
  workflow_dispatch:
    inputs:
      external_schedule:
        description: '외부 예약 실행(Cloudflare Cron, 2026-11-20 승인). 오늘 이미 성공했으면 건너뜀'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shares the pages group on purpose: both write to briefing-data.
  group: benefit-pages
  cancel-in-progress: false

jobs:
  notices:
    # Standard runners on public repositories are free. Never consume
    # unverified private-repository allowances or change repository visibility.
    if: github.event.repository.private == false && vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Skip a scheduled run when today's run already succeeded
        # Manual dispatches never run this (or any project code before the snapshot revision check).
        if: github.event_name == 'schedule' || inputs.external_schedule == true
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: 'true'
        run: python -m benefit_monitor.pipeline_timing --gate health-notices.yml
      - name: Collect district health-centre notice boards
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m benefit_monitor.health_notices --repository "$GITHUB_REPOSITORY"
