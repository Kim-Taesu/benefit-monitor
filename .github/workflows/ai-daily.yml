name: AI daily trial
on:
  # Primary trigger: start right after the free briefing collection finishes.
  # GitHub schedules were delayed for hours or dropped (2026-11-04..06).
  workflow_run:
    workflows: ['Daily benefit briefing']
    types: [completed]
    branches: [main]
  schedule:
    # Backup only; KST 06:00..23:45. The run itself has no clock gate: it waits for today's
    # completed free collection, and after 10:00 it dispatches a missing briefing.
    - cron: '*/15 0-14,21-23 * * *'
  workflow_dispatch:
    inputs:
      investigate_missing_conditions:
        description: '나들이 후보 추가 조사 (기본 활성, 하루 40회·월 원장 안, 후보당 최대 3회)'
        type: boolean
        default: true
      check_only:
        description: '복원·Secret·원격 저장만 검증, Claude 호출 없음'
        type: boolean
        default: true
      resume_reviewed_halt:
        description: '사람이 실패 원인을 확인한 뒤 실험 중단을 해제 (실패 기록은 유지)'
        type: boolean
        default: false
      grammar_probe_only:
        description: '조사 스키마 문법 컴파일만 시험 (유료 1건 미만 $0.001, 날짜 기록 없음, check_only 무시)'
        type: boolean
        default: false
      close_unresolved_reservation:
        description: '결과가 기록되지 않은 비용 예약을 예약 금액만큼 쓴 것으로 닫고 오늘을 한 번 다시 실행 (check_only 꺼야 함)'
        type: boolean
        default: false
      retry_rejected_day:
        description: '오늘 요청이 모두 무과금 4xx 거절이었으면 오늘을 한 번 재시도 (check_only 꺼야 함)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: benefit-ai-daily
  cancel-in-progress: false
jobs:
  ai:
    if: >-
      github.repository == 'Kim-Taesu/benefit-monitor' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      vars.BENEFIT_PAGES_ZERO_SPEND == 'confirmed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified project-local age
        run: python scripts/install_age.py
      - name: Run bounded AI trial or check only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENEFIT_AI_STATE_IDENTITY: ${{ secrets.BENEFIT_AI_STATE_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          BENEFIT_AI_CLOUD: '1'
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only && 'true' || 'false' }}
          RESUME_REVIEWED_HALT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_reviewed_halt && 'true' || 'false' }}
          CLOSE_UNRESOLVED_RESERVATION: ${{ github.event_name == 'workflow_dispatch' && inputs.close_unresolved_reservation && 'true' || 'false' }}
          RETRY_REJECTED_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_rejected_day && 'true' || 'false' }}
          INVESTIGATE_MISSING_CONDITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.investigate_missing_conditions == false && 'false' || 'true' }}
          GRAMMAR_PROBE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.grammar_probe_only && 'true' || 'false' }}
        run: |
          python scripts/run_ai_cloud.py
